# Android-App automatisch bauen und zu Google Play (interner Test) hochladen.
# Läuft bei Änderungen an der App-Hülle (mobile-app/, ohne iOS-Skript) oder per Knopf
# „Run workflow“ unter GitHub → Actions → „Android-App → Google Play“.
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 (Upload-Schlüssel .jks als Base64), ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (falls anders als das Keystore-Passwort),
#   PLAY_SERVICE_ACCOUNT_JSON (Inhalt der JSON-Datei des Google-Dienstkontos)
# Einrichtung: CLAUDE.md, Eintrag „Automatischer Android-Build“
name: Android-App → Google Play
on:
  workflow_dispatch:
    inputs:
      status:
        description: 'completed = gleich an Tester verteilen, draft = nur Entwurf in der Play Console'
        default: completed
        type: choice
        options: [completed, draft]
  push:
    branches: [main, claude/new-session-t3lg2s]
    paths:
      - 'mobile-app/**'
      - '!mobile-app/ios-einrichten.sh'
      - '.github/workflows/android-play.yml'
concurrency:
  group: android-play
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - name: Zugangsdaten vorhanden?
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$ALIAS" ] || [ -z "$SA" ]; then
            echo "::error::Secrets fehlen (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, PLAY_SERVICE_ACCOUNT_JSON)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Capacitor einrichten
        working-directory: mobile-app
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Upload-Schlüssel ablegen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/keys/upload.jks"
      - name: App-Bundle bauen (.aab)
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keys/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((100 + ${{ github.run_number }}))
          echo "Versionscode $VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/
      - name: Zu Google Play hochladen (interner Test)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.vivadeluxe.app
          releaseFiles: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.status || 'completed' }}
      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
