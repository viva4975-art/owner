# Betrieb auf einem eigenen Server (IONOS VPS): Datenbank (Postgres) + App + Caddy (HTTPS über Let's Encrypt).
# Die Datenbank ist nur im internen Docker-Netz erreichbar, nicht von außen.
# Start: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.live up -d --build
name: viva
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: viva
    volumes:
      - datenbank:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'viva']
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: ..
    env_file: .env.live
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Systemwächter prüft das Alter der täglichen Sicherung (nur die Statusdatei, nicht die Sicherungen selbst)
      BACKUP_DIR: /sicherung
    volumes:
      - daten:/data
      - /opt/viva-sicherung/status:/sicherung:ro
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:3000/anmelden']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  datenbank:
  daten:
  caddy_data:
  caddy_config:
